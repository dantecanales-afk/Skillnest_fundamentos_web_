<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Dante Canales">
    <title>Pagina de perfil</title>
     <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    
    <header class="Header">
        <nav class="Nav">
            <div class="Header_Title">
                <h1>Perfil</h1>
            </div>
            <div class="Header_Links">
                <a href="#">Inicio</a>
                <a href="#">Mi Perfil</a>
                <a href="#">Conexiones </a>
                <button>Cerrar sesión</button>
            </div>
        </nav>
    </header>
    <main class="Main">
        <section class="Perfil">


            <div class="Container_Perfil">
                <div class="Perfil_Box1">
                    <img src="static/img/thorfinn.png" alt="Perfil">
                </div>
                <div class="Perfil_Box2">
                    <h2>Dantesillo el huesillo</h2>
                    <p>Kattegat, Noruega.</p>
                    <h3>Desarrollador Frontend Conocimientos en HTML, CSS, JavaScript.</h3>
                    <a href="#">⚙ Editar Perfil</a>
                </div>
            </div>
        </section>
        <section class="Apartado_Conexiones">
            <div class="Row_Conexiones">
                <div class="Row_Conexiones_Title">
                    <h2>Solicitudes de conexión</h2>
                    <button>Ver todas</button>
                </div>
                <div class="Row_Conexion">
                    <div class="Row_Conexion_Perfil">
                        <img src="static/img/blank-avatar-photo-place-holder-600nw-1095249842.webp" alt="Perfil">
                        <h3>Steve Jobs</h3>
                    </div>
                    <div class="Row_Conexion_Images">
                        <img src="static/img/Дұрыссс.png" alt="Yes">
                        <img src="static/img/Iconos de computadora símbolo de redes sociales, cruz roja, logo, Internet png.png"
                            alt="No">
                    </div>
                </div>
                <div class="Row_Conexion">
                    <div class="Row_Conexion_Perfil">
                        <img src="static/img/blank-avatar-photo-place-holder-600nw-1095249842.webp" alt="Perfil">
                        <h3>Bill Gates</h3>
                    </div>
                    <div class="Row_Conexion_Images">
                        <img src="static/img/Дұрыссс.png" alt="Yes">
                        <img src="static/img/Iconos de computadora símbolo de redes sociales, cruz roja, logo, Internet png.png"
                            alt="No">
                    </div>
                </div>
            </div>
            <div class="Row_Conexiones">
                <div class="Row_Conexiones_Title">
                    <h2>Tus conexiones</h2>
                    <button>Ver todas</button>
                </div>
                <div class="Row_Conexion">
                    <div class="Row_Conexion_Perfil">
                        <img src="static/img/blank-avatar-photo-place-holder-600nw-1095249842.webp" alt="Perfil">
                        <h3>Richard Stallman</h3>
                    </div>
                </div>
                <div class="Row_Conexion">
                    <div class="Row_Conexion_Perfil">
                        <img src="static/img/blank-avatar-photo-place-holder-600nw-1095249842.webp" alt="Perfil">
                        <h3>Linus Torvalds</h3>
                    </div>
                </div>
                <div class="Row_Conexion">
                    <div class="Row_Conexion_Perfil">
                        <img src="static/img/blank-avatar-photo-place-holder-600nw-1095249842.webp" alt="Perfil">
                        <h3>Ada Lovelace</h3>
                    </div>
                </div>
                <div class="Row_Conexion">
                    <div class="Row_Conexion_Perfil">
                        <img src="static/img/blank-avatar-photo-place-holder-600nw-1095249842.webp" alt="Perfil">
                        <h3>Grace Hopper</h3>
                    </div>
                </div>

            </div>
        </section>
    </main>
</body>

</html>
